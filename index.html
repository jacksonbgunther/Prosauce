<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>ProSauce — Better sauces, upgraded nutrition.</title>
<template id="__bundler_thumbnail">

    <rect x="22" y="6" width="36" height="18" rx="3" fill="#131210"/>
    <rect x="18" y="36" width="44" height="22" rx="2" fill="#F2EBDB"/>
    <text x="40" y="52" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#131210">PS</text>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
:root {
  --cream: #F2EBDB;
  --cream-2: #ECE3CD;
  --paper: #F7F1E2;
  --backdrop: #ECEAE5;
  --ink: #131210;
  --ink-2: #2A2823;
  --muted: #6B675D;
  --line: #1F1D18;
  --red: #C8252C;
  --red-deep: #9C1B22;
  --gold: #B8964D;
  --gold-2: #D4B070;
  --green: #2F4A2A;
  --orange: #E78431;
  --sauce-orange: #F1A455;
  --sauce-green: #B5C19E;

  --display: "Bricolage Grotesque", "Helvetica Neue", sans-serif;
  --body: "Geist", "Helvetica Neue", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --serif: "Instrument Serif", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--body);
  color: var(--ink);
  background: var(--cream);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

.page { overflow-x: hidden; }

/* ----- Marquee ----- */
.marquee {
  background: var(--ink);
  color: var(--cream);
  border-bottom: 1px solid #000;
  overflow: hidden;
  position: relative;
  z-index: 60;
}
.marquee-track {
  display: flex;
  gap: 48px;
  padding: 11px 0;
  white-space: nowrap;
  animation: marqueeMove 50s linear infinite;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
}
.marquee-item { display: inline-flex; align-items: center; gap: 14px; }
.marquee-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--red);
}
@keyframes marqueeMove {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ----- Nav ----- */
.nav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: var(--cream);
  border-bottom: 1px solid rgba(19,18,16,0.12);
  transition: padding .25s ease, background .25s ease;
}
.nav-scrolled { background: rgba(242,235,219,0.94); backdrop-filter: blur(10px); }
.nav-inner {
  max-width: 1440px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 18px 40px;
  gap: 32px;
}
.nav-left, .nav-right {
  display: flex;
  align-items: center;
  gap: 28px;
}
.nav-right { justify-content: flex-end; }
.nav-link {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink);
  position: relative;
  padding: 6px 0;
  transition: opacity .2s ease;
}
.nav-link:hover { opacity: 0.55; }
.nav-link-muted { color: var(--ink-2); }
.wordmark {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: var(--display);
  font-weight: 800;
  font-size: 26px;
  letter-spacing: -0.01em;
  color: var(--ink);
}
.wordmark span:last-child::first-letter { color: var(--red); }
.cart-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border: 1px solid var(--ink);
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  white-space: nowrap;
  transition: background .2s ease, color .2s ease;
}
.cart-btn:hover { background: var(--ink); color: var(--cream); }
/* ----- Hero ----- */
.hero {
  background: var(--cream);
  position: relative;
  border-bottom: 1px solid rgba(19,18,16,0.12);
  overflow: hidden;
}
.hero-grid {
  max-width: 1440px;
  margin: 0 auto;
  padding: 56px 40px 80px;
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  gap: 60px;
  align-items: stretch;
  min-height: 720px;
}
.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 28px;
}
.eyebrow-dash {
  display: inline-block;
  width: 28px;
  height: 1px;
  background: var(--red);
}
.hero-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(48px, 7vw, 104px);
  line-height: 0.92;
  letter-spacing: -0.035em;
  margin: 0 0 36px;
  color: var(--ink);
}
.hero-title span { display: block; }
.hero-title-italic {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
  color: var(--red);
}
.hero-specs {
  display: flex;
  align-items: stretch;
  gap: 28px;
  padding: 22px 0;
  border-top: 1px solid rgba(19,18,16,0.18);
  border-bottom: 1px solid rgba(19,18,16,0.18);
  margin-bottom: 28px;
  max-width: 520px;
}
.spec { display: flex; flex-direction: column; }
.spec-num {
  font-family: var(--display);
  font-weight: 700;
  font-size: 44px;
  line-height: 1;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.spec-unit { font-size: 0.55em; font-weight: 600; }
.spec-label {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.4;
}
.spec-divider {
  width: 1px;
  background: rgba(19,18,16,0.15);
  align-self: stretch;
}
.hero-sub {
  font-size: 17px;
  line-height: 1.55;
  max-width: 480px;
  color: var(--ink-2);
  margin: 0 0 36px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 16px 26px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 600;
  transition: transform .2s ease, background .2s ease, color .2s ease, border-color .2s ease;
  border: 1px solid transparent;
  white-space: nowrap;
}
.btn:hover { transform: translateY(-1px); }
.btn-primary { background: var(--red); color: var(--cream); }
.btn-primary:hover { background: var(--red-deep); }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--cream); }
.btn-dark { background: var(--ink); color: var(--cream); }
.btn-dark:hover { background: var(--red); }
.btn-large { padding: 22px 36px; font-size: 13px; }
.btn-block { width: 100%; justify-content: center; }
/* Hero stage with bottles */
.hero-stage {
  position: relative;
  background: linear-gradient(180deg, var(--paper) 0%, var(--cream-2) 100%);
  border-radius: 6px;
  border: 1px solid rgba(19,18,16,0.08);
  overflow: hidden;
  min-height: 640px;
}
.hero-bigword {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(120px, 18vw, 260px);
  line-height: 0.82;
  letter-spacing: -0.05em;
  color: var(--cream-2);
  pointer-events: none;
  user-select: none;
}
.hero-bigword span:first-child { color: rgba(200,37,44,0.18); }
.hero-bottle {
  position: absolute;
  bottom: -2px;
  filter: drop-shadow(0 30px 40px rgba(19,18,16,0.18));
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}
.hero-bottle img { height: 100%; width: auto; object-fit: contain; }
.hero-bottle-front {
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  height: 92%;
  width: auto;
  z-index: 3;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.hero-bottle-back {
  left: 14%;
  height: 76%;
  width: auto;
  opacity: 0.6;
  transform: rotate(-6deg) translateY(40px);
  filter: grayscale(0.15) drop-shadow(0 20px 30px rgba(19,18,16,0.18));
  z-index: 2;
  display: flex;
  align-items: flex-end;
}
.hero-stage:hover .hero-bottle-front { transform: translateX(-50%) translateY(10px); }
.hero-stage:hover .hero-bottle-back { transform: rotate(-8deg) translateY(30px) translateX(-12px); }

.hero-tag {
  position: absolute;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--cream);
  border: 1px solid var(--ink);
  border-radius: 999px;
  padding: 10px 18px 10px 12px;
  z-index: 4;
}
.hero-tag-tl { top: 36px; left: 36px; }
.hero-tag-br { bottom: 36px; right: 36px; }
.hero-tag-num {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ink); color: var(--cream);
  display: inline-flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-size: 10px; font-weight: 700;
}
.hero-tag-text {
  font-family: var(--mono);
  font-size: 10px;
  line-height: 1.25;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
.hero-stamp {
  position: absolute;
  top: 28px;
  right: 36px;
  z-index: 4;
  animation: spin 30s linear infinite;
}
.stamp-text {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  fill: var(--ink);
}
.stamp-num {
  font-family: var(--display);
  font-weight: 700;
  font-size: 28px;
  fill: var(--red);
}
.stamp-sub {
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.2em;
  fill: var(--ink);
}
@keyframes spin { 100% { transform: rotate(360deg); } }

/* ----- Section Heading ----- */
.section-head { margin-bottom: 56px; }
.section-kicker {
  display: inline-flex;
  align-items: center;
  gap: 14px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--red);
  margin-bottom: 24px;
}
.section-num {
  font-weight: 700;
}
.section-line {
  display: inline-block; width: 36px; height: 1px; background: currentColor;
}
.section-title {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 5vw, 68px);
  line-height: 0.96;
  letter-spacing: -0.03em;
  margin: 0;
  max-width: 14ch;
}

/* ----- Lineup ----- */
.lineup {
  background: var(--paper);
  padding: 110px 0 120px;
  border-bottom: 1px solid rgba(19,18,16,0.08);
}
.lineup-inner { max-width: 1440px; margin: 0 auto; padding: 0 40px; }
.lineup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
  margin-bottom: 36px;
}
.product {
  background: var(--cream);
  border-radius: 8px;
  border: 1px solid rgba(19,18,16,0.08);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  transition: transform .3s ease, box-shadow .3s ease;
}
.product:hover { transform: translateY(-3px); box-shadow: 0 24px 60px rgba(19,18,16,0.08); }
.product-stage {
  position: relative;
  height: 480px;
  background: linear-gradient(180deg, var(--cream) 0%, color-mix(in oklab, var(--sauce) 18%, var(--cream)) 100%);
  overflow: hidden;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-top: 24px;
}
.product-stage-bg {
  position: absolute;
  bottom: -180px;
  left: 50%;
  transform: translateX(-50%);
  width: 520px;
  height: 520px;
  border-radius: 50%;
  background: var(--sauce);
  opacity: 0.32;
  filter: blur(2px);
}
.product-stage-letters {
  position: absolute;
  top: 24px;
  left: 28px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--ink);
  opacity: 0.55;
}
.product-bottle {
  position: relative;
  height: 94%;
  width: auto;
  max-width: 70%;
  object-fit: contain;
  z-index: 2;
  filter: drop-shadow(0 30px 40px rgba(19,18,16,0.2));
  transition: transform .5s cubic-bezier(.2,.7,.2,1);
}
.product-bottle-hover { transform: translateY(-12px) scale(1.03); }
.product-badge {
  position: absolute;
  top: 24px;
  right: 28px;
  background: var(--ink);
  color: var(--cream);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.2em;
  padding: 7px 11px;
  border-radius: 4px;
  z-index: 3;
}
.product-badge-sold { background: var(--red); font-weight: 700; font-size: 10px; }
.product-sold-out .product-bottle { filter: drop-shadow(0 30px 40px rgba(19,18,16,0.2)) saturate(0.85); }
.product-sold-out .product-price { text-decoration: line-through; color: var(--muted); }
.product-info {
  padding: 32px 32px 32px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  border-top: 1px solid rgba(19,18,16,0.1);
}
.product-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}
.product-eyebrow {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  color: var(--accent);
  margin-bottom: 6px;
}
.product-name {
  font-family: var(--display);
  font-weight: 700;
  font-size: 30px;
  letter-spacing: -0.02em;
  line-height: 1.05;
  margin: 0;
}
.product-price {
  font-family: var(--mono);
  font-weight: 600;
  font-size: 18px;
  padding-top: 14px;
}
.product-desc {
  font-size: 15px;
  line-height: 1.5;
  color: var(--ink-2);
  margin: 0;
}
.product-specs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: 1px solid rgba(19,18,16,0.18);
  border-radius: 4px;
  overflow: hidden;
}
.pspec {
  padding: 14px 12px;
  text-align: center;
  border-right: 1px solid rgba(19,18,16,0.12);
}
.pspec:last-child { border-right: 0; }
.pspec-num {
  font-family: var(--display);
  font-weight: 700;
  font-size: 22px;
  letter-spacing: -0.02em;
}
.pspec-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--muted);
  margin-top: 4px;
}
.product-use {
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--muted);
  border-bottom: 1px dashed rgba(19,18,16,0.2);
  padding-bottom: 16px;
}
.product-use-items { color: var(--ink); }
/* ----- Lifestyle ----- */
.lifestyle {
  background: var(--cream);
  padding: 120px 0 130px;
}
.lifestyle-inner { max-width: 1440px; margin: 0 auto; padding: 0 40px; }
.lifestyle-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-auto-rows: 260px;
  gap: 16px;
}
.tile { position: relative; }
.tile-pos-0 { grid-column: 1 / span 2; grid-row: 1 / span 2; }
.tile-pos-1 { grid-column: 3 / span 4; grid-row: 1; }
.tile-pos-2 { grid-column: 3 / span 2; grid-row: 2; }
.tile-pos-3 { grid-column: 5 / span 2; grid-row: 2; }
.tile-img {
  position: relative;
  width: 100%;
  height: 100%;
  background: var(--cream-2);
  border-radius: 6px;
  overflow: hidden;
  border: 1px solid rgba(19,18,16,0.08);
}
.tile-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: saturate(1.05) contrast(1.02);
  transition: transform .6s cubic-bezier(.2,.7,.2,1);
}
.tile:hover .tile-img img { transform: scale(1.04); }
.tile-img::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(19,18,16,0) 55%, rgba(19,18,16,0.35) 100%);
  pointer-events: none;
}
.tile-meta-tl, .tile-meta-br {
  position: absolute;
  z-index: 2;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}
.tile-meta-tl { top: 16px; left: 18px; }
.tile-meta-br { bottom: 16px; right: 18px; text-align: right; }
.tile-num {
  background: var(--ink);
  color: var(--cream);
  display: inline-block;
  padding: 4px 8px;
  border-radius: 3px;
  margin-bottom: 8px;
  font-weight: 600;
}
.tile-flavor {
  display: inline-block;
  background: var(--cream);
  color: var(--ink);
  padding: 4px 8px;
  border-radius: 3px;
}
.tile-label {
  font-family: var(--display);
  font-weight: 600;
  font-size: 16px;
  letter-spacing: -0.01em;
  text-transform: none;
  color: var(--cream);
  text-shadow: 0 1px 8px rgba(0,0,0,0.4);
}

/* ----- CTA ----- */
.cta {
  background: var(--red);
  color: var(--cream);
  padding: 80px 0 100px;
  position: relative;
  overflow: hidden;
}
.cta-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 40px;
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 40px;
  align-items: center;
  position: relative;
  z-index: 2;
}
.cta-bigword {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-weight: 800;
  font-size: clamp(160px, 22vw, 360px);
  letter-spacing: -0.05em;
  color: rgba(242,235,219,0.07);
  pointer-events: none;
  z-index: 1;
  white-space: nowrap;
}
.cta-content { position: relative; z-index: 3; }
.cta-line {
  font-family: var(--display);
  font-weight: 700;
  font-size: clamp(40px, 5vw, 64px);
  letter-spacing: -0.025em;
  line-height: 1.05;
  margin-bottom: 4px;
}
.cta-line-italic {
  font-family: var(--serif);
  font-style: italic;
  font-weight: 400;
  letter-spacing: -0.01em;
  margin-bottom: 32px;
}
.cta-line { margin-top: 0; }
.cta-kicker { margin-bottom: 20px; }
.cta-sub {
  font-size: 16px;
  line-height: 1.55;
  max-width: 520px;
  margin: 0 0 28px;
  color: rgba(242,235,219,0.88);
}
.cta-bottles {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: -20px;
  height: 420px;
  z-index: 3;
}
.cta-bottles img {
  height: 100%;
  width: auto;
  object-fit: contain;
  filter: drop-shadow(0 24px 30px rgba(0,0,0,0.25));
}
.cta-bottles img:nth-child(1) {
  transform: rotate(-6deg) translateY(10px);
  margin-right: -40px;
  z-index: 2;
}
.cta-bottles img:nth-child(2) {
  transform: rotate(6deg) translateY(10px);
  z-index: 1;
  height: 88%;
}

/* ----- Footer ----- */
.foot {
  background: var(--ink);
  color: var(--cream);
  padding: 80px 0 36px;
}
.foot-top {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 40px;
  display: grid;
  grid-template-columns: 1.2fr 2fr;
  gap: 48px;
  padding-bottom: 64px;
  border-bottom: 1px solid rgba(242,235,219,0.18);
}
.foot-brand { display: flex; flex-direction: column; gap: 12px; }
.foot-wordmark {
  font-family: var(--display);
  font-weight: 800;
  font-size: 44px;
  letter-spacing: -0.02em;
}
.foot-tag {
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  color: rgba(242,235,219,0.7);
  max-width: 22ch;
}
.foot-cols {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
}
.foot-col { display: flex; flex-direction: column; gap: 8px; }
.foot-col-h {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  color: var(--gold-2);
  text-transform: uppercase;
  margin-bottom: 12px;
}
.foot-col a {
  font-size: 14px;
  color: rgba(242,235,219,0.75);
  cursor: pointer;
  transition: color .2s ease;
}
.foot-col a:hover { color: var(--cream); }
.foot-bottom {
  max-width: 1440px;
  margin: 0 auto;
  padding: 28px 40px 0;
  display: flex;
  justify-content: space-between;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  color: rgba(242,235,219,0.5);
}
.foot-legal { display: flex; gap: 24px; }


/* ----- Sold out pill ----- */
.sold-out-pill {
  display: inline-flex;
  align-items: center;
  padding: 5px 10px;
  border-radius: 4px;
  background: var(--red);
  color: var(--cream);
  font-family: var(--mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  white-space: nowrap;
}
.sold-out-pill-light { background: var(--cream); color: var(--red); }

/* ----- Hero notify ----- */
.hero-notify { max-width: 560px; }
.hero-notify-label {
  display: flex;
  align-items: center;
  gap: 12px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink-2);
  margin-bottom: 14px;
}

/* ----- Notify form ----- */
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
}
.notify { display: flex; flex-direction: column; gap: 10px; }
.notify-fields { display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.notify-btn { grid-column: 1 / -1; justify-content: center; }
.notify-btn:disabled { opacity: 0.6; cursor: wait; transform: none; }
.notify-input {
  width: 100%;
  min-width: 0;
  padding: 15px 20px;
  border-radius: 999px;
  border: 1px solid var(--ink);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease;
}
.notify-input::placeholder { color: var(--muted); }
.notify-input:focus { border-color: var(--red); box-shadow: 0 0 0 3px rgba(200,37,44,0.15); }
.notify-hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
.notify-consent {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  line-height: 1.4;
  color: var(--ink-2);
  cursor: pointer;
}
.notify-consent input { margin-top: 2px; width: 16px; height: 16px; accent-color: var(--red); flex-shrink: 0; }
.notify-error { font-size: 13px; font-weight: 500; color: var(--red-deep); }
.notify-fine {
  margin: 2px 0 0;
  font-size: 11px;
  line-height: 1.45;
  color: var(--muted);
}
.notify-done {
  flex-direction: row;
  align-items: center;
  gap: 12px;
  padding: 16px 20px;
  border-radius: 12px;
  background: var(--green);
  color: var(--cream);
  font-size: 15px;
  line-height: 1.4;
  font-weight: 500;
}
.notify-check {
  display: inline-flex; align-items: center; justify-content: center;
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
  background: var(--cream); color: var(--green); font-weight: 700;
}
.notify-compact .notify-fields { grid-template-columns: 1fr; }
.notify-compact .notify-input { padding: 13px 18px; font-size: 14px; }
/* Dark variant (on red) */
.notify-dark .notify-input { background: var(--cream); border-color: var(--cream); }
.notify-dark .notify-input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(19,18,16,0.25); }
.notify-dark .notify-btn { background: var(--ink); color: var(--cream); }
.notify-dark .notify-btn:hover { background: var(--cream); color: var(--ink); }
.notify-dark .notify-consent { color: var(--cream); }
.notify-dark .notify-consent input { accent-color: var(--ink); }
.notify-dark .notify-error { color: var(--cream); background: rgba(19,18,16,0.35); padding: 8px 12px; border-radius: 6px; }
.notify-dark .notify-fine { color: rgba(242,235,219,0.8); }
.notify-dark.notify-done { background: var(--cream); color: var(--ink); }
.notify-dark .notify-check { background: var(--green); color: var(--cream); }

/* ----- Sweet Smoke ----- */
.sweet {
  background: var(--paper);
  padding: 120px 0 130px;
  border-top: 1px solid rgba(19,18,16,0.08);
}
.sweet-inner {
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 40px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 72px;
  align-items: center;
}
.sweet-photo {
  position: relative;
  aspect-ratio: 4 / 5;
  max-height: 680px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--cream-2);
  border: 1px solid rgba(19,18,16,0.08);
}
.sweet-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 40%;
}
.sweet-photo-tag {
  position: absolute;
  left: 20px;
  bottom: 20px;
  background: var(--orange);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  padding: 8px 12px;
  border-radius: 4px;
}
.sweet-kicker { color: var(--orange); }
.sweet .section-title { max-width: none; margin-bottom: 28px; }
.sweet-body {
  font-size: clamp(18px, 1.6vw, 22px);
  line-height: 1.5;
  color: var(--ink-2);
  max-width: 480px;
  margin: 0 0 36px;
}
.sweet .btn { white-space: normal; text-align: center; }

/* ----- Responsive ----- */
@media (max-width: 980px) {
  .nav-inner { grid-template-columns: auto 1fr auto; }
  .nav-left { display: none; }
  .hero-grid { grid-template-columns: 1fr; gap: 32px; padding: 32px 24px 48px; }
  .hero-stage { min-height: 480px; }
  .lineup-grid { grid-template-columns: 1fr; }
  .lifestyle-grid { grid-template-columns: 1fr 1fr; grid-auto-rows: 260px; }
  .tile-pos-0, .tile-pos-1, .tile-pos-2, .tile-pos-3 { grid-column: auto; grid-row: auto; }
  .sweet { padding: 80px 0 90px; }
  .sweet-inner { grid-template-columns: 1fr; gap: 40px; padding: 0 24px; }
  .sweet-photo { aspect-ratio: 4 / 3; }
  .cta-inner { grid-template-columns: 1fr; }
  .cta-bottles { height: 320px; }
  .foot-top { grid-template-columns: 1fr; }
  .foot-cols { grid-template-columns: repeat(3, 1fr); }
  .lineup-inner, .lifestyle-inner, .cta-inner {
    padding-left: 24px; padding-right: 24px;
  }
}
@media (max-width: 600px) {
  .lifestyle-grid { grid-template-columns: 1fr; grid-auto-rows: 240px; }
  .notify-fields { grid-template-columns: 1fr; }
  .cta-bottles { height: 240px; }
  .foot-cols { grid-template-columns: 1fr; }
  .hero-tag-tl, .hero-tag-br, .hero-stamp { display: none; }
  .notify-btn { white-space: normal; text-align: center; }
}
</style>
</head>
